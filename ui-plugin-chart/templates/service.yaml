apiVersion: v1
kind: Service
metadata:
  name: ui-plugin-catalog
  labels:
    {{- include "ui-plugin-chart.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ui-plugin-chart.selectorLabels" . | nindent 4 }}
