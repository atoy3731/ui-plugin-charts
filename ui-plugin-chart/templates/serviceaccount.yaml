apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui-plugin-catalog-sa
  labels:
    {{- include "ui-plugin-chart.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
