apiVersion: v1
kind: Pod
metadata:
  name: ui-plugin-catalog-test
  labels:
    {{- include "ui-plugin-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['ui-plugin-catalog.{{ .Release.Namespace }}:{{ .Values.service.port }}']
  restartPolicy: Never
